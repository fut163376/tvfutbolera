<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#ff9900">
    <title>TV Deportiva - Fire TV</title>
    <link rel="manifest" href="manifest.json">
    <link rel="icon" type="image/png" href="https://raw.githubusercontent.com/fut163376/tvfutbolera/refs/heads/main/tv-logo-free-vector.png">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        
        body {
            background: linear-gradient(135deg, #0c0c0c 0%, #1a1a1a 100%);
            color: #fff;
            padding: 20px;
            overflow-x: hidden;
            min-height: 100vh;
        }
        
        header {
            text-align: center;
            margin-bottom: 40px;
            padding: 20px;
            background: rgba(0, 0, 0, 0.7);
            border-radius: 15px;
            border-bottom: 3px solid #ff9900;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.5);
        }
        
        h1 {
            font-size: 3rem;
            color: #ff9900;
            text-shadow: 2px 2px 8px rgba(255, 153, 0, 0.5);
            letter-spacing: 1px;
            margin-bottom: 10px;
        }
        
        .container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
            gap: 25px;
            max-width: 1300px;
            margin: 0 auto;
        }
        
        .boton {
            background: linear-gradient(145deg, #2a2a2a, #222);
            border-radius: 18px;
            padding: 25px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
            border: 2px solid #333;
            box-shadow: 8px 8px 20px rgba(0, 0, 0, 0.4),
                        -4px -4px 12px rgba(255, 255, 255, 0.03);
            position: relative;
            overflow: hidden;
        }
        
        .boton::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(45deg, rgba(255,153,0,0.1) 0%, transparent 70%);
            opacity: 0;
            transition: opacity 0.3s;
        }
        
        .boton:hover, .boton:focus {
            transform: translateY(-8px);
            border-color: #ff9900;
            box-shadow: 0 12px 25px rgba(0, 0, 0, 0.6);
        }
        
        .boton:hover::before {
            opacity: 1;
        }
        
        .boton:active {
            transform: translateY(0);
        }
        
        .boton.seleccionado {
            transform: scale(1.06);
            border-color: #ff9900;
            box-shadow: 0 0 25px rgba(255, 153, 0, 0.8);
        }
        
        .boton.seleccionado::before {
            opacity: 1;
        }
        
        .imagen-boton {
            width: 100%;
            height: 180px;
            border-radius: 12px;
            margin-bottom: 20px;
            background-color: #333;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            position: relative;
            border: 2px solid #444;
        }
        
        .imagen-boton img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            transition: transform 0.3s;
        }
        
        .boton:hover .imagen-boton img {
            transform: scale(1.05);
        }
        
        .nombre-boton {
            font-size: 1.5rem;
            margin-bottom: 10px;
            color: #fff;
            font-weight: bold;
            text-shadow: 1px 1px 3px rgba(0, 0, 0, 0.8);
            height: 60px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .error-imagen {
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: #444;
            color: #fff;
            font-size: 1rem;
            text-align: center;
            padding: 10px;
        }
        
        .error-imagen .icono {
            font-size: 2.5rem;
            margin-bottom: 10px;
            color: #ff9900;
        }
        
        /* Contenedor del reproductor */
        #contenedor-canal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 100;
            background: #000;
        }
        
        #iframe-canal {
            width: 100%;
            height: 100%;
            border: none;
        }
        
        footer {
            text-align: center;
            margin-top: 50px;
            padding: 25px;
            color: #aaa;
            font-size: 1.1rem;
        }
        
        /* Efecto de enfoque para navegación con teclado */
        .boton:focus {
            outline: 3px solid #ff9900;
            outline-offset: 3px;
        }
        
        /* Responsive */
        @media (max-width: 1200px) {
            .container {
                grid-template-columns: repeat(3, 1fr);
            }
            
            h1 {
                font-size: 2.5rem;
            }
        }
        
        @media (max-width: 900px) {
            .container {
                grid-template-columns: repeat(2, 1fr);
                gap: 20px;
            }
            
            h1 {
                font-size: 2.3rem;
            }
            
            .nombre-boton {
                font-size: 1.3rem;
            }
        }
        
        @media (max-width: 600px) {
            .container {
                grid-template-columns: 1fr;
                max-width: 400px;
            }
            
            h1 {
                font-size: 2rem;
            }
            
            .boton {
                padding: 20px;
            }
            
            .imagen-boton {
                height: 160px;
            }
        }

        /* Notificación de instalación */
        #installButton {
            display: none;
            position: fixed;
            bottom: 20px;
            left: 20px;
            background: #ff9900;
            color: #000;
            border: none;
            border-radius: 30px;
            padding: 12px 20px;
            font-size: 1rem;
            cursor: pointer;
            z-index: 1000;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.5);
        }
    </style>
</head>
<body>
    <header>
        <h1>TV Deportiva</h1>
    </header>
    
    <div class="container" id="contenedor-botones">
        <!-- Los botones se generarán con JavaScript -->
    </div>
    
    <div id="contenedor-canal">
        <iframe id="iframe-canal" src="about:blank"></iframe>
    </div>
    
    <button id="installButton">Instalar App</button>
    
    <footer>
        <p>Disfruta del contenido</p>
    </footer>

    <script>
        // Datos de los botones (imagen, nombre y URL)
        const botonesData = [
            {
                nombre: "MOVISTAR LA LIGA FHD",
                imagen: "https://i.ibb.co/yfV1Q8n/liga.png",
                url: "https://embed.ksdjugfsddeports.com/embed2/movistarlaliga.html"
            },
            {
                nombre: "DAZN LA LIGA FHD",
                imagen: "https://raw.githubusercontent.com/tv-logo/tv-logos/main/countries/spain/dazn-laliga-es.png",
                url: "https://embed.ksdjugfsddeports.com/embed2/daznlaliga.html"
            },
            {
                nombre: "MOVISTAR LIGA DE CAMPEONES FHD",
                imagen: "https://raw.githubusercontent.com/davidmuma/picons_dobleM/master/icon/M%2B%20Liga%20de%20Campeones.png",
                url: "https://embed.ksdjugfsddeports.com/embed2/movistarligadecampeones.html"
            },
            {
                nombre: "DAZN F1 FHD",
                imagen: "https://i.ibb.co/2Ndmtbp/f1.png",
                url: "https://embed.ksdjugfsddeports.com/embed2/daznf1.html"
            },
            {
                nombre: "BEIN SPORTS XTRA FHD",
                imagen: "https://raw.githubusercontent.com/davidmuma/picons_dobleM/master/icon/beIN%20SPORTS%201.png",
                url: "https://embed.ksdjugfsddeports.com/embed2/beinsportsxtra.html"
            },
            {
                nombre: "TNT SPORTS FHD",
                imagen: "https://raw.githubusercontent.com/davidmuma/picons_dobleM/master/icon/TNT%20Sports%201.png",
                url: "https://embed.ksdjugfsddeports.com/embed2/tntsports.html"
            }
        ];

        // Variables para la navegación
        let botonSeleccionado = 0;
        let columnas = 3; // Valor inicial, se actualizará dinámicamente
        let modoCanalActivo = false;
        let deferredPrompt;

        // Elementos DOM
        const contenedorBotones = document.getElementById('contenedor-botones');
        const contenedorCanal = document.getElementById('contenedor-canal');
        const iframeCanal = document.getElementById('iframe-canal');
        const installButton = document.getElementById('installButton');

        // Service Worker Registration
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js')
                .then((registration) => {
                    console.log('SW registered: ', registration);
                })
                .catch((registrationError) => {
                    console.log('SW registration failed: ', registrationError);
                });
            });
        }

        // Before Install Prompt
        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
            deferredPrompt = e;
            installButton.style.display = 'block';
            
            installButton.addEventListener('click', () => {
                installButton.style.display = 'none';
                deferredPrompt.prompt();
                deferredPrompt.userChoice.then((choiceResult) => {
                    if (choiceResult.outcome === 'accepted') {
                        console.log('User accepted the install prompt');
                    } else {
                        console.log('User dismissed the install prompt');
                    }
                    deferredPrompt = null;
                });
            });
        });

        // Función para calcular el número de columnas según el ancho de pantalla
        function calcularColumnas() {
            const anchoPantalla = window.innerWidth;
            
            if (anchoPantalla >= 1200) {
                return 3;
            } else if (anchoPantalla >= 900) {
                return 2;
            } else {
                return 1;
            }
        }

        // Función para cargar imágenes con manejo de errores
        function cargarImagen(url, nombre) {
            return new Promise((resolve, reject) => {
                const img = new Image();
                img.onload = () => resolve(url);
                img.onerror = () => {
                    console.error(`Error cargando imagen: ${url}`);
                    resolve(null);
                };
                img.src = url;
            });
        }

        // Función para generar los botones
        async function generarBotones() {
            contenedorBotones.innerHTML = ''; // Eliminar mensaje de carga
            
            for (let i = 0; i < botonesData.length; i++) {
                const boton = botonesData[i];
                
                // Intentar cargar la imagen
                const imagenCargada = await cargarImagen(boton.imagen, boton.nombre);
                
                const elementoBoton = document.createElement('div');
                elementoBoton.className = 'boton';
                elementoBoton.tabIndex = 0;
                elementoBoton.setAttribute('role', 'button');
                elementoBoton.setAttribute('aria-label', boton.nombre);
                elementoBoton.setAttribute('data-indice', i);
                
                // Contenido HTML del botón
                elementoBoton.innerHTML = `
                    <div class="imagen-boton">
                        ${imagenCargada ? 
                            `<img src="${boton.imagen}" alt="${boton.nombre}" onerror="this.parentNode.innerHTML='<div class=\'error-imagen\'><div class=\'icono\'>📺</div>${boton.nombre}</div>'">` : 
                            `<div class="error-imagen"><div class="icono">📺</div>${boton.nombre}</div>`
                        }
                    </div>
                    <div class="nombre-boton">${boton.nombre}</div>
                `;
                
                // Eventos para clic y teclado
                elementoBoton.addEventListener('click', () => {
                    abrirCanal(boton.url);
                });
                
                elementoBoton.addEventListener('keydown', (e) => {
                    if (e.key === 'Enter' || e.key === ' ') {
                        abrirCanal(boton.url);
                    }
                });
                
                contenedorBotones.appendChild(elementoBoton);
            }
            
            // Actualizar número de columnas
            columnas = calcularColumnas();
            
            // Inicializar la navegación
            actualizarSeleccion();
        }

        // Función para abrir un canal
        function abrirCanal(url) {
            iframeCanal.src = url;
            contenedorCanal.style.display = 'block';
            contenedorBotones.style.display = 'none';
            document.querySelector('header').style.display = 'none';
            document.querySelector('footer').style.display = 'none';
            installButton.style.display = 'none';
            modoCanalActivo = true;
            
            // Intentar entrar en modo pantalla completa
            entrarPantallaCompleta();
            
            // Cambiar el título para indicar que estamos en un canal
            document.title = "Reproduciendo canal - TV Deportiva";
            
            // Enfocar el iframe para que pueda recibir eventos de teclado
            setTimeout(() => {
                iframeCanal.focus();
            }, 100);
        }

        // Función para entrar en modo pantalla completa
        function entrarPantallaCompleta() {
            const elem = document.documentElement;
            
            if (elem.requestFullscreen) {
                elem.requestFullscreen().catch(err => {
                    console.log(`Error al intentar pantalla completa: ${err.message}`);
                });
            } else if (elem.mozRequestFullScreen) { /* Firefox */
                elem.mozRequestFullScreen();
            } else if (elem.webkitRequestFullscreen) { /* Chrome, Safari and Opera */
                elem.webkitRequestFullscreen();
            } else if (elem.msRequestFullscreen) { /* IE/Edge */
                elem.msRequestFullscreen();
            }
        }

        // Función para salir del modo pantalla completa
        function salirPantallaCompleta() {
            if (document.exitFullscreen) {
                document.exitFullscreen();
            } else if (document.mozCancelFullScreen) { /* Firefox */
                document.mozCancelFullScreen();
            } else if (document.webkitExitFullscreen) { /* Chrome, Safari and Opera */
                document.webkitExitFullscreen();
            } else if (document.msExitFullscreen) { /* IE/Edge */
                document.msExitFullscreen();
            }
        }

        // Función para volver al menú
        function volverAlMenu() {
            iframeCanal.src = 'about:blank';
            contenedorCanal.style.display = 'none';
            contenedorBotones.style.display = 'grid';
            document.querySelector('header').style.display = 'block';
            document.querySelector('footer').style.display = 'block';
            
            // Mostrar botón de instalación si está disponible
            if (deferredPrompt) {
                installButton.style.display = 'block';
            }
            
            modoCanalActivo = false;
            
            // Restaurar el título original
            document.title = "TV Deportiva - Fire TV";
            
            // Salir del modo pantalla completa
            salirPantallaCompleta();
            
            // Reenfocar el menú
            actualizarSeleccion();
        }

        // Función para manejar la navegación con teclado
        function manejarNavegacion(event) {
            // Si estamos en modo canal, solo manejar la tecla Escape
            if (modoCanalActivo) {
                if (event.key === 'Escape') {
                    event.preventDefault();
                    event.stopPropagation();
                    volverAlMenu();
                    return false;
                }
                return;
            }
            
            // Actualizar número de columnas (por si cambió el tamaño de pantalla)
            columnas = calcularColumnas();
            
            // Navegación en el menú principal
            const teclas = {
                ArrowUp: () => {
                    if (botonSeleccionado >= columnas) {
                        botonSeleccionado -= columnas;
                        actualizarSeleccion();
                    }
                },
                ArrowDown: () => {
                    if (botonSeleccionado < botonesData.length - columnas) {
                        botonSeleccionado += columnas;
                        actualizarSeleccion();
                    }
                },
                ArrowLeft: () => {
                    if (botonSeleccionado % columnas !== 0) {
                        botonSeleccionado--;
                        actualizarSeleccion();
                    }
                },
                ArrowRight: () => {
                    if (botonSeleccionado % columnas !== columnas - 1 && botonSeleccionado < botonesData.length - 1) {
                        botonSeleccionado++;
                        actualizarSeleccion();
                    }
                },
                Enter: () => {
                    const boton = botonesData[botonSeleccionado];
                    abrirCanal(boton.url);
                },
                Escape: () => {
                    // No hacer nada en el menú principal
                }
            };

            if (teclas[event.key]) {
                event.preventDefault();
                teclas[event.key]();
            }
        }

        // Función para actualizar la selección visual
        function actualizarSeleccion() {
            const botones = document.querySelectorAll('.boton');
            botones.forEach((boton, index) => {
                if (index === botonSeleccionado) {
                    boton.classList.add('seleccionado');
                    boton.focus();
                } else {
                    boton.classList.remove('seleccionado');
                }
            });
        }

        // Inicializar la aplicación cuando se cargue el DOM
        document.addEventListener('DOMContentLoaded', () => {
            generarBotones();
            
            // Listener principal para teclado
            document.addEventListener('keydown', manejarNavegacion);
            
            // Listener adicional para capturar el evento Escape en modos especiales
            window.addEventListener('keydown', function(e) {
                if (modoCalanActivo && e.key === 'Escape') {
                    e.preventDefault();
                    e.stopPropagation();
                    volverAlMenu();
                    return false;
                }
            }, true);
            
            // También capturamos el evento de cambio de pantalla completa
            document.addEventListener('fullscreenchange', function() {
                if (!document.fullscreenElement && modoCanalActivo) {
                    // Si salimos de pantalla completa pero seguimos en modo canal,
                    // volvemos al menú
                    volverAlMenu();
                }
            });
            
            // Actualizar columnas cuando cambia el tamaño de la ventana
            window.addEventListener('resize', function() {
                columnas = calcularColumnas();
            });
        });
    </script>
</body>
</html>
